name: Build Android APK
# Builds the VIMO Android app in the cloud, so it can be installed without
# a laptop. Phone: open github.com in the browser → this repository →
# Actions → "Build Android APK" → Run workflow (choose the branch). When it
# finishes, open the run and download "vimo-apk" under Artifacts, unzip it
# and open app-release.apk (allow "Install unknown apps" once).
# The release build is signed with the debug key (android/app/build.gradle.kts),
# which is fine for testing on the owner's phones, not for the Play Store.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Build the APK
        run: flutter build apk --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: vimo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
