name: Firestore checks
on:
  pull_request:
    branches: [codex/ranch-vendor-market-glass]
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test tools
        run: npm install --prefix /tmp/vimo-rules --no-save firebase-tools @firebase/rules-unit-testing firebase
      - name: Validate rules in demo emulator
        env:
          NODE_PATH: /tmp/vimo-rules/node_modules
        run: |
          mkdir -p tmp
          /tmp/vimo-rules/node_modules/.bin/firebase emulators:exec --only firestore --project demo-vimo --config firebase.test.json 'node test/run_rules_checks.cjs'
