name: Flutter checks
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-pub | tee analyze.txt
      - name: Report analyzer findings
        if: always()
        run: |
          grep -E '^\s*(error|warning) - ' analyze.txt | head -40 | while IFS= read -r line; do
            level=$(echo "$line" | sed -E 's/^\s*(error|warning) - .*/\1/')
            loc=$(echo "$line" | grep -oE '[A-Za-z0-9_\\/.-]+\.dart:[0-9]+:[0-9]+' | tail -1)
            file=$(echo "$loc" | cut -d: -f1 | tr '\\' '/')
            ln=$(echo "$loc" | cut -d: -f2)
            msg=$(echo "$line" | sed -E 's/^\s*(error|warning) - //')
            echo "::${level} file=${file},line=${ln}::${msg}"
          done
          grep -E 'issues? found|No issues found' analyze.txt | tail -1 | sed 's/^/::notice::Analyze: /' || true
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --no-pub -r json > test.json
      - name: Report test failures
        if: always()
        run: |
          python3 - <<'PY'
          import json
          names, errors, prints, passed, failed = {}, {}, {}, 0, 0
          for line in open('test.json', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              t = e.get('type')
              if t == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              elif t == 'print':
                  prints.setdefault(e['testID'], []).append(e.get('message', ''))
              elif t == 'error':
                  errors.setdefault(e['testID'], []).append(
                      (e.get('error', '') + '\n' + e.get('stackTrace', '')))
              elif t == 'testDone' and not e.get('hidden'):
                  if e.get('result') == 'success':
                      passed += 1
                  else:
                      failed += 1
          def esc(s):
              return s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          for tid, errs in list(errors.items())[:20]:
              logged = '\n'.join(prints.get(tid, []))
              keep = [l for l in logged.splitlines()
                      if l.strip() and not l.strip().startswith('#')
                      and 'package:flutter' not in l and '═' not in l][:30]
              text = '\n'.join(keep) + '\n----\n' + '\n'.join(errs)
              lines = [l for l in text.splitlines() if l.strip()][:55]
              print('::error title=' + esc(names.get(tid, str(tid))[:180]) + '::' + esc('\n'.join(lines)[:3500]))
          print(f'::notice::Tests passed={passed} failed={failed}')
          PY
      - name: Build web
        id: build
        continue-on-error: true
        run: flutter build web --release --no-pub --no-wasm-dry-run
      - name: Result
        run: |
          echo "analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}"
          echo "::notice::analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} build=${{ steps.build.outcome }}"
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
