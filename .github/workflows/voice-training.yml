name: Train VIMO voice
# Legacy Firestore jobs can still be run explicitly. New recording
# and lesson files are stored in the owner's private Drive.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job id (leave empty to take the oldest requested job)
        required: false
        default: ''
permissions:
  contents: read
# Learning from the recordings (cow names as the owner says them) always
# runs. Fine-tuning VIMO's own listening model waits for the offline engine
# on the phone: set to '1' to run it too.
env:
  VIMO_FINETUNE: '0'
concurrency:
  group: voice-training
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      job: ${{ steps.find.outputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Firestore client
        run: pip install --quiet google-cloud-firestore
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Find a requested job
        id: find
        working-directory: tools/voice_training
        env:
          REQUESTED: ${{ inputs.job_id }}
        run: |
          job="$REQUESTED"
          if [ -z "$job" ]; then job="$(python train_job.py check)"; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
          if [ -z "$job" ]; then echo "::notice::No training requested"; else echo "::notice::Training job $job"; fi

  train:
    needs: check
    if: needs.check.outputs.job != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Packs are published to this repository's free "voice-packs" release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/voice_training/requirements*.txt
      - name: Keep the model checkpoint between runs
        uses: actions/cache@v4
        with:
          path: tools/voice_training/work/checkpoint
          key: voice-ckpt-${{ github.run_id }}
          restore-keys: voice-ckpt-
      - name: Keep the speech recogniser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: Install training tools (CPU)
        working-directory: tools/voice_training
        run: |
          pip install --quiet -r requirements-lessons.txt
          if [ "$VIMO_FINETUNE" = "1" ]; then
            pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            pip install --quiet -r requirements.txt
          fi
      - name: Check the training scripts
        working-directory: tools/voice_training
        run: python -m pytest -q tests
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Train, check and publish
        working-directory: tools/voice_training
        env:
          VIMO_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VIMO_MAX_MINUTES: '300'
          GH_TOKEN: ${{ github.token }}
        run: python train_job.py run "${{ needs.check.outputs.job }}"
      - name: Keep the training report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-training-report
          path: tools/voice_training/work/train_report.json
          if-no-files-found: ignore
